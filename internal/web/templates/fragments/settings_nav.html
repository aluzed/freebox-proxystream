{{define "settings_nav.html"}}
{{/* hx-boost turns these into fragment swaps with real URLs behind them:
     no full page reload, but /settings/status still works pasted into a tab. */}}
<nav class="subnav" aria-label="Sections des réglages"
     hx-boost="true" hx-target="#settings-body" hx-select="#settings-body"
     hx-swap="outerHTML" hx-push-url="true">
  <a href="/settings/libraries" class="subnav-link{{if eq . "libraries"}} is-active{{end}}"
     {{if eq . "libraries"}}aria-current="page"{{end}}>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>
    <span>Bibliothèques</span>
  </a>
  <a href="/settings/status" class="subnav-link{{if eq . "status"}} is-active{{end}}"
     {{if eq . "status"}}aria-current="page"{{end}}>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
    <span>État du serveur</span>
  </a>
  <a href="/settings/account" class="subnav-link{{if eq . "account"}} is-active{{end}}"
     {{if eq . "account"}}aria-current="page"{{end}}>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Compte</span>
  </a>
</nav>
{{end}}
