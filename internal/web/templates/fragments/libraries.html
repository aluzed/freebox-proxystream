{{define "libraries.html"}}
{{if not .Libraries}}
  <p class="muted">Aucune bibliothèque pour le moment.</p>
{{else}}
<ul class="library-list">
  {{range .Libraries}}
  <li class="library-item">
    <div class="library-info">
      <strong>{{.Name}}</strong>
      <span class="muted">{{if eq .Kind "tv"}}Séries{{else}}Films{{end}}</span>
      <code>{{.FTPPath}}</code>
      <span class="muted">Dernière analyse : {{timeAgo .LastScan}}</span>
    </div>
    <div class="library-actions">
      <button type="button" class="btn btn-outline w-full-mobile" title="Analyser cette bibliothèque"
              hx-post="/ui/libraries/{{.ID}}/scan" hx-target="#status" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span>Analyser</span>
      </button>
      <button type="button" class="btn btn-outline w-full-mobile"
              title="Réassocier les titres et affiches sans relire les fichiers"
              hx-post="/ui/libraries/{{.ID}}/refresh" hx-target="#status" hx-swap="innerHTML">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M4 10a8 8 0 0 1 14-3l2 3"/><path d="M20 14a8 8 0 0 1-14 3l-2-3"/></svg>
        <span>Réassocier les métadonnées</span>
      </button>
      <button type="button" class="btn btn-outline btn-danger-outline w-full-mobile"
              title="Supprimer la bibliothèque {{.Name}}"
              onclick="confirmAction('Supprimer la bibliothèque « {{.Name}} » et tous ses médias indexés ?', () => htmx.ajax('DELETE', '/ui/libraries/{{.ID}}', {target:'#libraries', swap:'innerHTML'}))">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        <span>Supprimer</span>
      </button>
    </div>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}
